name: ESPForge firmware build
run-name: ESPForge build ${{ inputs.espforge_build_uuid || github.event.client_payload.espforge_build_uuid }}

"on":
  workflow_dispatch:
    inputs:
      espforge_build_uuid:
        description: Unique ESPForge build identifier
        required: true
        type: string
  repository_dispatch:
    types: [espforge_build]

permissions:
  contents: read

concurrency:
  group: espforge-${{ inputs.espforge_build_uuid || github.event.client_payload.espforge_build_uuid }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Arduino CLI
        run: |
          python -m pip install --disable-pip-version-check pyserial==3.5
          curl --proto '=https' --tlsv1.2 -fsSLo arduino-cli.tar.gz https://github.com/arduino/arduino-cli/releases/download/v1.3.1/arduino-cli_1.3.1_Linux_64bit.tar.gz
          echo "376428d7d45be640c00812a71612e1742edc2f5f9ee3742a2d6da7870e079588  arduino-cli.tar.gz" | sha256sum --check --strict
          mkdir -p bin && tar -xzf arduino-cli.tar.gz -C bin arduino-cli
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./bin/arduino-cli config set library.enable_unsafe_install true
          ./bin/arduino-cli core update-index
          ./bin/arduino-cli core install esp32:esp32@2.0.10
          cp "Libraries/platform.txt" "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.10/platform.txt"
      - name: Install detected libraries
        run: |
          arduino-cli lib install 'PCF8574 library@2.3.7'
          arduino-cli lib install 'Adafruit PN532@1.3.4'
          arduino-cli lib install 'ArduinoJson@6.18.2'
          arduino-cli lib install 'TFT_eSPI@2.5.43'
          arduino-cli lib install 'XPT2046_Touchscreen@1.4'
          arduino-cli lib install 'RF24@1.5.0'
          arduino-cli lib install 'rc-switch@2.6.4'
          arduino-cli lib install 'NimBLE-Arduino@1.4.2'
          arduino-cli lib install 'IRremoteESP8266@2.8.6'
          arduino-cli lib install 'arduinoFFT@1.6.2'
          python - <<'PY'
          import pathlib, re, shutil
          destination = pathlib.Path.home() / 'Arduino' / 'libraries'
          destination.mkdir(parents=True, exist_ok=True)
          def metadata(path):
              values = {}
              for line in path.read_text(errors='ignore').splitlines():
                  if '=' in line:
                      key, value = line.split('=', 1); values[key.strip().lower()] = value.strip()
              return values
          installed = {re.sub(r'[^a-z0-9]', '', metadata(path).get('name', path.parent.name).lower()) for path in destination.glob('*/library.properties')}
          for properties in pathlib.Path('.').glob('**/library.properties'):
              if '.git' in properties.parts or len(properties.parts) > 8: continue
              info = metadata(properties); key = re.sub(r'[^a-z0-9]', '', info.get('name', properties.parent.name).lower())
              if not key or key in installed: continue
              target = destination / re.sub(r'[^A-Za-z0-9_.-]', '-', properties.parent.name)
              if not target.exists(): shutil.copytree(properties.parent, target)
              installed.add(key)
          PY
          find Libraries -type f -name '*.zip' ! -iname '*TFT*' -print0 | while IFS= read -r -d '' zip; do arduino-cli lib install --zip-path "$zip"; done
          cp "Libraries/User_Setup v2.h" "$HOME/Arduino/libraries/TFT_eSPI/User_Setup.h"
      - name: Compile firmware
        run: arduino-cli compile --fqbn "esp32:esp32:esp32s3:PSRAM=enabled,PartitionScheme=min_spiffs,FlashMode=dio" --output-dir firmware-output 'ESP32-DIV'
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: espforge-firmware
          path: firmware-output/
          if-no-files-found: error